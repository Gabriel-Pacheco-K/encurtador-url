name: Manter acordado

# O plano gratuito do Render desliga o serviço após 15 min sem acessos.
# Um acesso a cada 10 min mantém a demo pronta para quem abrir pelo portfólio.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acessa a demo
        run: curl --silent --show-error --fail --max-time 120 --retry 2 -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" https://encurtador-url-j4kj.onrender.com/
